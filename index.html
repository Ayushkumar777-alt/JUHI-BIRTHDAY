<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --dusk:#2b1642;--lantern:#ffb45e;--blush:#f7bfd3;--paper:#fcf3e6;--ink:#4a2a3c;
  --serif:'Cormorant Garamond',Georgia,serif;--hand:'Caveat','Segoe Print',cursive;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;height:100dvh;min-height:-webkit-fill-available;
  background:var(--dusk);color:#fff;font-family:var(--serif);
  overflow:hidden;touch-action:manipulation;
}
#bg{
  position:fixed;inset:0;width:100%;height:100%;height:100dvh;
  object-fit:cover;transition:filter 1.2s;
}
body.dim #bg{filter:brightness(.45) saturate(1.1) blur(3px)}
.veil{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at center,rgba(43,22,66,.15),rgba(43,22,66,.6));
  pointer-events:none;
}
.stage{
  position:fixed;inset:0;height:100%;height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1.2rem, 3.5vh, 2rem);
  padding:calc(env(safe-area-inset-top,0px) + 0.8rem) 1.2rem calc(env(safe-area-inset-bottom,0px) + 1.2rem);
  text-align:center;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s;
}
.stage.on{opacity:1;visibility:visible}
h1{
  font-style:italic;font-weight:600;
  font-size:clamp(1.9rem,6.5vw,4.2rem);line-height:1.15;
  text-shadow:0 2px 25px rgba(43,22,66,.85);
  max-width:min(90vw, 16ch);padding:0 0.5rem;word-break:break-word;
}
h1 span{color:#ffd08a;display:inline-block}
.chip{
  display:none;position:absolute;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));
  font:600 clamp(1rem, 3.8vw, 1.2rem) var(--hand);color:#fff;
  background:rgba(43,22,66,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.4rem 1.1rem;
  cursor:pointer;user-select:none;
}
.chip.show{display:block}
#s1 h1,#s1 .btn{opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity 1.4s,transform 1.4s}
#s1.reveal h1,#s1.reveal .btn{opacity:1;transform:none;pointer-events:auto}
#s1.reveal .btn{transition-delay:.7s}
.btn{
  font:600 clamp(1.25rem, 4.8vw, 1.55rem) var(--hand);color:var(--dusk);
  background:linear-gradient(#ffd08a,var(--lantern));border:0;border-radius:99px;
  padding:clamp(.65rem, 2.5vw, .85rem) clamp(1.8rem, 6vw, 2.5rem);
  cursor:pointer;box-shadow:0 0 0 0 rgba(255,180,94,.6),0 8px 30px rgba(255,150,60,.45);
  animation:glow 2.4s infinite;user-select:none;touch-action:manipulation;
  transition:transform .15s ease,filter .15s ease;
}
.btn:active{transform:scale(.96);filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes glow{60%{box-shadow:0 0 0 22px rgba(255,180,94,0),0 8px 30px rgba(255,150,60,.45)}}
#lanterns{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.ln{
  position:absolute;bottom:-90px;
  width:clamp(36px, 9vw, 44px);height:clamp(48px, 12vw, 58px);
  border-radius:40% 40% 46% 46%;background:radial-gradient(circle at 50% 70%,#fff3c4,var(--lantern) 55%,#e0662f);
  box-shadow:0 0 35px 10px rgba(255,170,80,.6);opacity:0;animation:rise 2.6s ease-in forwards;
}
@keyframes rise{10%{opacity:1}100%{transform:translateY(-125vh) translateX(var(--dx));opacity:1}}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#ffe2a8,#ff9c5a);opacity:0;pointer-events:none;z-index:6;transition:opacity .9s}
#flash.on{opacity:.9}
#s2{background:#000;padding:0}
.frame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden}
.frame video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
#openbtn{
  position:absolute;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(8% + env(safe-area-inset-bottom,0px));
  opacity:0;pointer-events:none;transition:opacity .8s, transform .2s ease;white-space:nowrap;
}
#openbtn.show{opacity:1;pointer-events:auto}
#openbtn:active{transform:translateX(-50%) scale(.96)}
/* envelope */
.env{
  position:relative;width:min(86vw, 360px);aspect-ratio:1.5;
  cursor:pointer;perspective:900px;user-select:none;touch-action:manipulation;
  transition:transform .2s ease;
}
.env:active{transform:scale(.98)}
.env .back,.env .front,.env .flap{position:absolute;inset:0;border-radius:6px}
.env .back{background:#e9a7bd}
.env .front{
  background:linear-gradient(135deg,#f7c3d5 50%,transparent 50%),linear-gradient(225deg,#f3b1c8 50%,transparent 50%),linear-gradient(#f9cadb,#f0aac2);
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3;
}
.env .flap{
  background:#f2b3c9;clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;
  transition:transform .9s .1s,z-index 0s .5s;z-index:4;box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.env .seal{
  position:absolute;left:50%;top:50%;
  width:clamp(46px, 12vw, 54px);height:clamp(46px, 12vw, 54px);
  margin:calc(clamp(46px, 12vw, 54px) / -2);
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9db8,#c93a66);
  z-index:5;display:grid;place-items:center;font-size:clamp(1.3rem, 4vw, 1.5rem);transition:opacity .4s;
}
.env .note{position:absolute;left:8%;right:8%;top:6%;height:88%;background:var(--paper);border-radius:4px;z-index:2;transition:transform 1s .8s}
.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0}
.env.open .note{transform:translateY(-52%)}
.hint{font:500 clamp(1.3rem, 4.5vw, 1.6rem) var(--hand);opacity:.9;margin-top:.5rem}
/* letter reader modal */
#reader{
  position:fixed;inset:0;z-index:8;display:flex;justify-content:center;align-items:flex-start;
  background:rgba(43,22,66,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:calc(1.2rem + env(safe-area-inset-top,0px)) clamp(0.75rem, 3vw, 1.5rem) calc(2.5rem + env(safe-area-inset-bottom,0px));
}
#reader.on{opacity:1;visibility:visible}
.paper{
  margin:auto;width:min(95vw, 640px);background:var(--paper);color:var(--ink);border-radius:12px;
  padding:clamp(1.3rem, 4.5vw, 2.8rem) clamp(1rem, 4vw, 2.4rem);text-align:left;
  box-shadow:0 20px 60px rgba(0,0,0,.5);transform:translateY(30px) scale(.97);
  transition:transform 1s cubic-bezier(.2,.8,.2,1);
  background-image:repeating-linear-gradient(transparent 0 35px,rgba(200,120,150,.18) 35px 36px);
  word-break:break-word;overflow-wrap:break-word;
}
#reader.on .paper{transform:none}
.paper h2{font:600 clamp(1.8rem, 6vw, 2.6rem)/1.15 var(--hand);margin-bottom:1rem}
.paper p{font:500 clamp(1.25rem, 4.4vw, 1.55rem)/36px var(--hand);margin-bottom:36px}
.paper .sign{text-align:right;max-width:none;margin-bottom:24px}
.next{display:block;margin:1rem auto 0;font-size:clamp(1.2rem, 4.2vw, 1.45rem);padding:.7rem 1.8rem;width:min(100%, 320px)}
#videoView{display:none;margin:auto;flex-direction:column;align-items:center;width:100%}
#reader.vid .paper{display:none}#reader.vid #videoView{display:flex}
#videoView video{
  width:min(92vw, 420px, calc((100dvh - 8.5rem)*9/16));
  max-height:calc(100dvh - 8rem);
  aspect-ratio:9/16;object-fit:cover;border-radius:16px;background:#000;display:block;
  box-shadow:0 0 0 4px rgba(252,243,230,.92),0 25px 70px rgba(0,0,0,.6);
}
/* Navigation & Go Back Buttons */
.goback{
  position:fixed;z-index:4;font:600 clamp(1.1rem, 3.8vw, 1.3rem) var(--hand);
  color:var(--ink);background:rgba(252,243,230,.94);border:0;border-radius:99px;
  padding:.45rem 1.2rem;cursor:pointer;box-shadow:0 4px 18px rgba(20,5,40,.35);
  user-select:none;touch-action:manipulation;transition:transform .15s ease, background-color .15s ease;
}
.goback:active{transform:scale(.95);background:rgba(252,243,230,1)}
.goback:focus-visible{outline:3px solid #fff;outline-offset:3px}
#envback{
  top:calc(1rem + env(safe-area-inset-top,0px));left:1rem;bottom:auto;transform:none;
}
#dogback{
  position:absolute;z-index:4;top:calc(1rem + env(safe-area-inset-top,0px));left:1rem;bottom:auto;transform:none;
  background:rgba(43,22,66,.65);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3);
}
.goback.inline{position:static;transform:none;display:block;margin:1.4rem auto 0;border:2px solid rgba(74,42,60,.25);box-shadow:0 4px 14px rgba(20,5,40,.25)}
#videoView .goback.inline{margin-top:1.2rem;border:0}
#playbtn{
  display:none;position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);
  width:clamp(74px, 18vw, 92px);height:clamp(74px, 18vw, 92px);border-radius:50%;border:0;
  font-size:clamp(1.8rem, 5vw, 2.2rem);color:var(--ink);background:rgba(252,243,230,.95);
  cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.55);place-items:center;touch-action:manipulation;
}
#playbtn.show{display:grid}
#playbtn:active{transform:translate(-50%,-50%) scale(.94)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
@media (max-width: 480px){
  .paper{border-radius:10px;padding:1.4rem 1.1rem}
  .paper p{font-size:1.35rem}
  .stage{padding:calc(env(safe-area-inset-top,0px) + 0.5rem) 0.8rem calc(env(safe-area-inset-bottom,0px) + 1rem)}
}
</style></head>
<body>
<audio id="music" src="assets/music.mp3" loop preload="auto"></audio>
<video id="bg" src="assets/bg.mp4" poster="assets/poster.jpg" autoplay muted loop playsinline webkit-playsinline></video><div class="veil"></div>

<section class="stage on" id="s1">
  <h1 id="title">Happy Birthdayyy<br><span>JUHI CUTIPIE ❤️</span></h1>
  <button class="btn" id="go">Click here</button>
  <button class="chip" id="musicchip">🔊 Tap for music</button>
</section>

<section class="stage" id="s2">
  <div class="frame"><video id="dog" src="assets/dog.mp4" playsinline webkit-playsinline preload="auto"></video></div>
  <button id="playbtn" aria-label="Play video">▶</button>
  <button class="goback" id="dogback">← Go back</button>
  <button class="btn" id="openbtn">Open it</button>
</section>

<section class="stage" id="s3">
  <div class="env" id="env" tabindex="0" role="button" aria-label="Open the envelope">
    <div class="back"></div><div class="note"></div><div class="front"></div><div class="flap"></div><div class="seal">♥</div>
  </div>
  <p class="hint" id="hint">Tap the envelope</p>
  <button class="goback" id="envback">← Go back</button>
</section>

<div id="reader"><article class="paper">
  <h2 id="lTo"></h2>
  <div id="lBody"></div>
  <p class="sign" id="lFrom"></p>
  <button class="btn next" id="nextbtn">Watch your surprise ▶</button>
  <button class="goback inline" id="back">← Go back</button>
</article>
  <div id="videoView"><video id="lvid" controls playsinline webkit-playsinline preload="auto"></video><button class="goback inline" id="vback">← Go back</button></div></div>

<div id="lanterns"></div><div id="flash"></div>

<script>
/* ---- EDIT THE LETTER HERE ---- */
const LETTER={
  to:"Happy birthday bachuuuuu!!❤️",
  body:[
    "umm hope you enjoy your day rather then sleeping whole day \"AND DO TAP THE SUPRISE BUTTON\"",
    "ik we fight alot with each other but yehi to seen hai apna tujhse ladna fir mera tereko manana, aur tere seevaye manaya he kisko hai ya hurt kia maine ...no one, haan ik i irritate u alot ke call nhi krti ye wo so on ...but You don't know your voice is so expressive and the non stop laughs makes my day.",
    "sometimes i really feel i wish i could pull your cheeks and treat you like i always wanted to but there were circumstances that didn't let thing work and really you are more prettier when you are chubby i may laugh at you while boding shaming but deep down i really charish you!!!",
    "you must be thinking that he have so many people around him but why do i text u...mann aur khussi to tujse  baatein kar k milta hai mujhe,  tujhe mujse baat kr k pata nhi kaisa lgta",
    "i genuinely care for u islia text krta hun khena to bohot kch hai but bol nahi pata mein chat or call pe nahi bol paunga kbhi hahha,",
    "AUR YE KONSE ISOLATION MEIN REHH RHII TU BILKUL ACHI NAHI LGTI TU SMJHIII",
    "mein kabhi kabhi tere pe gussa nikaal deta hun par mujhe genuinely kabhi kabhi bura lgta jab hum ladte, our happiness and smiles matter the most or tu hai cutest tbhi pyaare words niklte chats pe mujsee",
    "no nazar to you, lotsssss of loveeeeeeee"
],
  from:"",
  video:"assets/letter.mp4" /* the letter video */
};
/* ------------------------------ */
const $=id=>document.getElementById(id);
/* text appears after the door opens in the background video (~4.8s), hides again when it loops */
const bgv=$('bg'),REVEAL_AT=4.8;
bgv.addEventListener('timeupdate',()=>$('s1').classList.toggle('reveal',bgv.currentTime>=REVEAL_AT));
/* birthday instrumental: starts when the door opens, fades out as the lanterns blow up */
const mus=$('music'),chip=$('musicchip');let wantMusic=false,doorMusic=false,musicFade;
function startMusic(){clearInterval(musicFade);mus.muted=false;mus.volume=.65;const r=mus.play();
  if(r&&r.then)r.then(()=>chip.classList.remove('show')).catch(()=>{if(wantMusic)chip.classList.add('show')})}
function stopMusic(delay){wantMusic=false;chip.classList.remove('show');
  setTimeout(()=>{clearInterval(musicFade);musicFade=setInterval(()=>{if(mus.volume>.05)mus.volume=Math.max(0,mus.volume-.05);else{mus.pause();clearInterval(musicFade)}},60)},delay||0)}
bgv.addEventListener('timeupdate',()=>{if(bgv.currentTime>=REVEAL_AT&&!doorMusic&&$('s1').classList.contains('on')){doorMusic=true;wantMusic=true;mus.currentTime=0;startMusic()}});
document.addEventListener('pointerdown',()=>{if(wantMusic&&mus.paused)startMusic()}); /* browsers need one tap before sound */
chip.onclick=()=>{wantMusic=true;startMusic()};
/* if the browser blocks sound at the door, any tap before that unlocks it so the music still starts by itself */
document.addEventListener('pointerdown',()=>{if(!doorMusic&&mus.paused){mus.muted=true;mus.play().catch(()=>{})}});
setTimeout(()=>$('s1').classList.add('reveal'),7000); /* fallback if autoplay is blocked */
const show=id=>{document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('on',s.id===id))};
$('lTo').textContent=LETTER.to;$('lFrom').textContent=LETTER.from;if(!LETTER.from)$('lFrom').style.display='none';
LETTER.body.forEach(t=>{const p=document.createElement('p');p.textContent=t;$('lBody').appendChild(p)});
const lv=$('lvid');if(LETTER.video){lv.src=LETTER.video}else{$('nextbtn').style.display='none'}
$('nextbtn').onclick=()=>{const r=$('reader');r.classList.add('vid');r.scrollTop=0;lv.currentTime=0;lv.play().catch(()=>{})};

const dog=$('dog'),ob=$('openbtn'),pb=$('playbtn');let obT;
function startDog(){
  dog.currentTime=0;ob.classList.remove('show');clearTimeout(obT);
  const r=dog.play();
  if(r&&r.catch)r.catch(()=>pb.classList.add('show')); /* blocked by browser: show a tap-to-play button */
  obT=setTimeout(()=>ob.classList.add('show'),6000);
}
$('go').onclick=()=>{
  wantMusic=true;if(mus.paused)startMusic();stopMusic(1500);
  /* unlock video playback inside this tap (needed on iPhone/Safari), then rewind */
  const u=dog.play();if(u&&u.then)u.then(()=>{dog.pause();dog.currentTime=0}).catch(()=>{});
  const L=$('lanterns');
  for(let i=0;i<22;i++){const d=document.createElement('div');d.className='ln';
    d.style.left=(Math.random()*100)+'%';d.style.setProperty('--dx',(Math.random()*80-40)+'px');
    d.style.animationDelay=(Math.random()*1.1)+'s';d.style.transform='scale('+(.6+Math.random()*.9)+')';L.appendChild(d)}
  setTimeout(()=>$('flash').classList.add('on'),1500);
  setTimeout(()=>{show('s2');$('flash').classList.remove('on');L.innerHTML='';startDog()},2500);
};
dog.addEventListener('ended',()=>ob.classList.add('show'));
dog.addEventListener('playing',()=>pb.classList.remove('show'));
dog.addEventListener('click',()=>dog.paused?dog.play():dog.pause());
pb.onclick=()=>startDog();
$('dogback').onclick=()=>{clearTimeout(obT);dog.pause();dog.currentTime=0;ob.classList.remove('show');pb.classList.remove('show');show('s1');if(bgv.currentTime>=REVEAL_AT){wantMusic=true;startMusic()}};
$('envback').onclick=()=>{document.body.classList.remove('dim');show('s2');startDog()};
ob.onclick=()=>{clearTimeout(obT);document.body.classList.add('dim');dog.pause();pb.classList.remove('show');show('s3')};
const env=$('env');
const openEnv=()=>{if(env.classList.contains('open'))return;env.classList.add('open');$('hint').style.opacity=0;
  setTimeout(()=>{const r=$('reader');r.classList.add('on');r.scrollTop=0},2200)};
$('back').onclick=()=>{const r=$('reader');if(r.classList.contains('vid')){lv.pause();r.classList.remove('vid');r.scrollTop=0;return}
  r.classList.remove('on');setTimeout(()=>{env.classList.remove('open');$('hint').style.opacity=.9},1000)};
$('vback').onclick=()=>{lv.pause();$('reader').classList.remove('vid');$('reader').scrollTop=0};
env.onclick=openEnv;env.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnv()}};
</script>
</body></html>
